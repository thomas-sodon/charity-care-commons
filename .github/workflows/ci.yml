# Continuous integration (design section 12, "Regression checks in CI").
#
# test        always; no API cost: install, ruff, pytest (engine
#             property tests, Schedule H parser fixtures, quote verifier,
#             readback), `ccc demo` end to end, offline evals on the replay fixtures, the
#             regression gates and the Open FAP Schema compatibility check.
# smoke-live  pull requests that touch prompts/, schemas/ or the compiler, and
#             only when the ANTHROPIC_API_KEY secret exists (never on forks):
#             the live `smoke` suite (~$2), gated against the baseline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests, offline evals and schema check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCC_LLM: replay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, configured in pyproject.toml)
        run: ruff check src evals tests

      - name: Unit and property tests
        run: python -m pytest -q

      - name: Offline evals on replay fixtures (zero cost)
        run: |
          for suite in smoke full engine packet; do
            python -m evals run --suite "$suite" --mode replay \
              --db "$RUNNER_TEMP/evals.sqlite" --out-dir "$RUNNER_TEMP/eval-runs" --report-dir "$RUNNER_TEMP/eval-report"
          done

      - name: End-to-end offline demo (ccc demo)
        run: |
          ccc demo --workdir "$RUNNER_TEMP/demo-run" --site-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/demo-run/packet/packet.pdf"
          test -s "$RUNNER_TEMP/demo-run/release/fields.parquet"
          test -s "$RUNNER_TEMP/demo-run/evals/report/latest.md"

      - name: Regression gates vs evals/baselines
        run: |
          status=0
          for suite in smoke full engine packet; do
            python -m evals gate --suite "$suite" --runs-dir "$RUNNER_TEMP/eval-runs" || status=1
          done
          exit $status

      - name: Open FAP Schema compatibility
        run: |
          base="$RUNNER_TEMP/base-open-fap-schema.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="origin/${{ github.base_ref }}"
          else
            ref="HEAD^"
          fi
          git show "$ref:schemas/open-fap-schema.json" > "$base" 2>/dev/null || : > "$base"
          python -m evals schema-compat --base "$base"

      - name: Upload eval runs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evals
          path: |
            ${{ runner.temp }}/eval-runs
            ${{ runner.temp }}/eval-report
            ${{ runner.temp }}/site
            ${{ runner.temp }}/demo-run/packet
          if-no-files-found: ignore

  smoke-live:
    name: Live smoke eval (prompts, schemas, compiler)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CCC_LLM: live
      CCC_DAILY_SPEND_CAP_USD: "5"
      CCC_RUN_TOKEN_CEILING: "2000000"
      CCC_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: scope
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not available; skipping the live smoke suite"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(prompts/|schemas/|src/charitycare/compile/|src/charitycare/schemas\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no prompt, schema or compiler changes; skipping the live smoke suite"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Live smoke suite (~$2)
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m evals run --suite smoke --mode live \
            --db "$RUNNER_TEMP/evals.sqlite" --out-dir "$RUNNER_TEMP/eval-runs" --report-dir "$RUNNER_TEMP/eval-report"

      - name: Gate (drop > 2 points, citation validity < 100%, cost/hospital > +25%)
        if: steps.scope.outputs.run == 'true'
        run: python -m evals gate --suite smoke --runs-dir "$RUNNER_TEMP/eval-runs"

      - name: Upload live eval run
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-eval
          path: |
            ${{ runner.temp }}/eval-runs
            ${{ runner.temp }}/eval-report
            ${{ runner.temp }}/site
            ${{ runner.temp }}/demo-run/packet
