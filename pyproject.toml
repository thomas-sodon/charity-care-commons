[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "charitycare"
version = "0.1.0"
description = "Charity Care Commons (Texas edition): an open, cited, IRS-cross-checked registry of nonprofit hospital financial-assistance rules, plus a navigator packet compiler."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "DATA_LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Charity Care Commons contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "lxml>=5.0",
  "jinja2>=3.1",
  "anthropic>=0.70",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "duckdb>=1.0",
  "pyarrow>=15",
  "mcp>=1.0",
  "pillow>=10",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tldextract>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
ccc = "charitycare.cli:main"

[tool.hatch.build.targets.wheel]
# `evals` is the top-level evaluation harness (python -m evals / ccc eval); it reads its
# suites, baselines and datasets from its own directory, so it is used from a checkout.
packages = ["src/charitycare", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pymupdf.*"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["data", "fixtures", "site/dist"]

[tool.ruff.lint]
select = ["F", "E9", "I"]
