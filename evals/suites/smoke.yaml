# Cheap per-PR suite (section 12: "smoke", ~$2 live on 10 dev policies).
# Runs offline on replay fixtures in every CI build, and live on PRs that touch
# prompts/, schemas/ or compile/ when the ANTHROPIC_API_KEY secret exists.
name: smoke
description: Compile the smoke subset and score every field against gold.
kind: compile
dataset: demo
split: smoke
est_live_cost_usd: 2.0
targets:
  numeric_threshold_exact: {min: 0.97}
  threshold_abstention_rate: {max: 0.10}
  categorical_macro_f1: {min: 0.90}
  list_item_f1: {min: 0.85}
  citation_validity: {min: 1.0, hard: true}
  schedule_h_free_pct_agreement: {min: 0.85}
  disagreement_triage_rate: {min: 1.0}
  calibration_ece: {max: 0.05}
  cost_per_hospital_usd: {max: 0.50}
